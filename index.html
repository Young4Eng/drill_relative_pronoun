    function App() {
      const [gameState, setGameState] = useState('locked');
      const [passwordInput, setPasswordInput] = useState('');
      const [passwordError, setPasswordError] = useState(false);

      // Dynamic Leveling States
      const [currentLevel, setCurrentLevel] = useState(1);
      const [levelProgress, setLevelProgress] = useState(0); 
      const [currentDrill, setCurrentDrill] = useState(null);
      const pendingLevelRef = useRef(1);
      const [reviewIdx, setReviewIdx] = useState(0);

      const [score, setScore] = useState(0);
      const [combo, setCombo] = useState(0);
      const [maxCombo, setMaxCombo] = useState(0);
      const [timeLeft, setTimeLeft] = useState(200);
      const [lap, setLap] = useState(1);
      const [stats, setStats] = useState({ correct: 0, total: 0 });
      const [mistakes, setMistakes] = useState([]);

      const [selectedParts, setSelectedParts] = useState([]);
      const [shuffledOptions, setShuffledOptions] = useState([]);
      const [typedInput, setTypedInput] = useState('');
      
      const [feedback, setFeedback] = useState(null);
      const [userWrongInput, setUserWrongInput] = useState('');
      const [wrongTimeoutId, setWrongTimeoutId] = useState(null);
      
      const [personalBest, setPersonalBest] = useState({ score: 0, tier: '아이언 (Iron)' });
      const [prevTier, setPrevTier] = useState('아이언 (Iron)');
      const [showTierUpAnimation, setShowTierUpAnimation] = useState(false);

      const inputRef = useRef(null);

      useEffect(() => {
        const savedBest = localStorage.getItem('relative_arcade_best');
        if (savedBest) {
          setPersonalBest(JSON.parse(savedBest));
        }
      }, []);

      const getTierMetadata = (currentScore) => {
        const tier = TIERS_CONFIG.find(t => currentScore >= t.min);
        return tier || TIERS_CONFIG[TIERS_CONFIG.length - 1];
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (passwordInput === '0329') {
          setGameState('welcome');
          setPasswordError(false);
        } else {
          setPasswordError(true);
          setPasswordInput('');
          setTimeout(() => setPasswordError(false), 500);
        }
      };

      useEffect(() => {
        if (gameState === 'playing' && timeLeft > 0) {
          const timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timer);
                finishSpeedrun();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
          return () => clearInterval(timer);
        }
      }, [gameState, timeLeft]);

      useEffect(() => {
        if (gameState === 'playing') {
          const currentTier = getTierMetadata(score).name;
          if (currentTier !== prevTier) {
            const currentIndex = TIERS_CONFIG.findIndex(t => t.name === currentTier);
            const prevIndex = TIERS_CONFIG.findIndex(t => t.name === prevTier);
            if (currentIndex < prevIndex) {
              setShowTierUpAnimation(true);
              setTimeout(() => setShowTierUpAnimation(false), 1500);
            }
            setPrevTier(currentTier);
          }
        }
      }, [score, prevTier, gameState]);

      const finishSpeedrun = () => {
        setGameState('result');
      };

      useEffect(() => {
         if(gameState === 'result') {
            const finalTier = getTierMetadata(score).name;
            const currentRecord = { score, tier: finalTier };
            if (score > personalBest.score) {
              setPersonalBest(currentRecord);
              localStorage.setItem('relative_arcade_best', JSON.stringify(currentRecord));
            }
         }
      }, [gameState, score]);

      const loadNewDrill = (lvl) => {
        if (gameState === 'reviewing') {
          const nextIdx = reviewIdx + 1;
          if (nextIdx >= mistakes.length) {
            setGameState('review_done');
          } else {
            setReviewIdx(nextIdx);
            const nextDrill = mistakes[nextIdx];
            setCurrentDrill(nextDrill);
            initDrill(nextDrill);
          }
          return;
        }

        const pool = ALL_DRILLS_POOL.filter(d => d.level === lvl);
        let newDrill = pool[Math.floor(Math.random() * pool.length)];

        if (currentDrill && currentDrill.expected === newDrill.expected && pool.length > 1) {
          const others = pool.filter(d => d.expected !== currentDrill.expected);
          newDrill = others[Math.floor(Math.random() * others.length)];
        }

        setCurrentDrill(newDrill);
        initDrill(newDrill);
      };

      const initDrill = (drillData) => {
        setSelectedParts([]);
        setTypedInput('');
        setFeedback(null);
        setUserWrongInput('');

        if (drillData.type === 'common_noun' || drillData.type === 'choice' || drillData.type === 'arrange') {
          const optionsWithIds = drillData.options.map((opt, i) => ({ id: i, text: opt }));
          setShuffledOptions(optionsWithIds.sort(() => Math.random() - 0.5));
        } else {
          setTimeout(() => {
            if (inputRef.current) inputRef.current.focus();
          }, 50);
        }
      };

      const startGame = () => {
        setScore(0);
        setCombo(0);
        setMaxCombo(0);
        setTimeLeft(200);
        setLap(1);
        setPrevTier('아이언 (Iron)');
        setStats({ correct: 0, total: 0 });
        setMistakes([]);
        
        setCurrentLevel(1);
        setLevelProgress(0);
        pendingLevelRef.current = 1;
        setGameState('playing');
        
        loadNewDrill(1);
      };

      const startReview = () => {
        setReviewIdx(0);
        setGameState('reviewing');
        const firstDrill = mistakes[0];
        setCurrentDrill(firstDrill);
        initDrill(firstDrill);
      };

      const normalizeText = (text) => text.toLowerCase().replace(/[.,!?]/g, '').replace(/\s+/g, ' ').trim();

      const handleCorrect = () => {
        if (gameState === 'reviewing') {
          setFeedback('correct');
          setTimeout(() => loadNewDrill(0), 500);
          return;
        }

        const baseScore = 150;
        const comboMultiplier = 1 + (combo * 0.2); 
        const earned = Math.round(baseScore * comboMultiplier);
        
        setScore(prev => prev + earned);
        setCombo(prev => {
          const newCombo = prev + 1;
          setMaxCombo(m => Math.max(m, newCombo));
          return newCombo;
        });
        setStats(prev => ({ ...prev, correct: prev.correct + 1, total: prev.total + 1 }));

        // Level progression logic
        let nextLevel = currentLevel;
        let nextProgress = levelProgress + 1;
        let nextLap = lap;

        if (nextProgress >= 3) {
          nextProgress = 0;
          if (currentLevel < 10) {
            nextLevel = currentLevel + 1;
          } else {
            nextLap = lap + 1;
            nextLevel = 6; 
          }
        }

        setCurrentLevel(nextLevel);
        setLevelProgress(nextProgress);
        setLap(nextLap);
        pendingLevelRef.current = nextLevel;

        setFeedback('correct');
        setTimeout(() => {
          loadNewDrill(nextLevel);
        }, 500);
      };

      const handleMistake = (wrongStr) => {
        if (gameState === 'reviewing') {
          setUserWrongInput(wrongStr || '응답 없음');
          setFeedback('wrong');
          const id = setTimeout(() => {
            advanceNext();
          }, 3000);
          setWrongTimeoutId(id);
          return;
        }

        setCombo(0);
        setStats(prev => ({ ...prev, total: prev.total + 1 }));
        setMistakes(prev => [...prev, currentDrill]);

        // Level drop logic
        let nextLvl = currentLevel;
        let dropped = false;
        
        if (currentLevel > 1) {
          nextLvl = currentLevel - 1;
          dropped = true;
        }

        setCurrentLevel(nextLvl);
        setLevelProgress(0); 
        pendingLevelRef.current = nextLvl;

        setUserWrongInput(wrongStr || '응답 없음');
        setFeedback(dropped ? 'wrong_drop' : 'wrong');
        
        const id = setTimeout(() => {
          advanceNext();
        }, 3000);
        setWrongTimeoutId(id);
      };

      const advanceNext = () => {
        if (wrongTimeoutId) {
          clearTimeout(wrongTimeoutId);
          setWrongTimeoutId(null);
        }
        loadNewDrill(pendingLevelRef.current);
      };

      useEffect(() => {
        if (currentDrill && currentDrill.type === 'arrange' && selectedParts.length === 4 && feedback === null) {
          const userJoined = selectedParts.map(p => p.text).join(' ');
          const expectedJoined = currentDrill.expected.join(' ');
          if (userJoined === expectedJoined) {
            handleCorrect();
          } else {
            handleMistake(userJoined);
          }
        }
      }, [selectedParts]);

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && typedInput.trim() && feedback === null) {
          if (normalizeText(typedInput) === normalizeText(currentDrill.expected)) {
            handleCorrect();
          } else {
            handleMistake(typedInput);
          }
        }
      };

      const selectOption = (opt) => {
        if (feedback !== null) return;
        if (currentDrill.type === 'arrange') {
          setSelectedParts([...selectedParts, opt]);
          setShuffledOptions(shuffledOptions.filter(o => o.id !== opt.id));
        } else {
          if (opt.text === currentDrill.expected) {
            handleCorrect();
          } else {
            handleMistake(opt.text);
          }

              <div className="text-right hidden sm:block">
                <div className="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Score</div>
                <div className="font-mono font-black text-xl text-gray-900 leading-none">{score.toLocaleString()}</div>
              </div>
              <div className={`flex items-center gap-1.5 px-3 py-1 rounded-md border transition-all ${combo > 2 ? 'bg-orange-50 border-orange-200 text-orange-500 scale-105' : 'bg-gray-50 border-gray-200 text-gray-600'}`}>
                <Flame className={`w-4 h-4 ${combo > 2 ? 'animate-bounce text-orange-500' : ''}`} />
                <span className="font-black font-mono">{combo}x</span>
              </div>
            </div>
          )}
        </div>
      );

      return (
        <div className="min-h-screen bg-gray-100 text-gray-900 font-sans flex flex-col p-4 overflow-x-hidden selection:bg-indigo-200 selection:text-indigo-900">
          {gameState !== 'locked' && renderHeader()}
          
          <main className="flex-1 flex flex-col">
            {gameState === 'locked' && renderLocked()}
            {gameState === 'welcome' && renderWelcome()}
            {(gameState === 'playing' || gameState === 'reviewing') && currentDrill && renderPlayingOrReviewing()}
            {gameState === 'result' && renderResult()}
            {gameState === 'review_done' && renderReviewDone()}
          </main>

          <style dangerouslySetInnerHTML={{__html: `
            @keyframes fade-in {
              from { opacity: 0; transform: translateY(10px); }
              to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
          `}} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
